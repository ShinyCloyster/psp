// Participants sign in anonymously; the host signs in with Google. Firestore rules give write access to state/setup only to HOST_EMAIL.
async function fbInit(){
  try{
    firebase.initializeApp(FB_CONFIG);
    const auth = firebase.auth();
    await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
    if(!auth.currentUser) await auth.signInAnonymously();
    auth.onAuthStateChanged(u => {
      const host = !!(u && u.email === HOST_EMAIL);
      const was = S.canEdit; S.canEdit = host; S.userReady = true;
      if(host !== was || !S.fbReady) { S.fbReady = true; render(); }
    });
    return firebase.firestore();
  }catch(e){ console.error(e); return null; }
}
function hostLogin(){
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())

}

<style>
/* Layout: phone = one centered column; screen = a 1920×1080 canvas scaled to the display, running the deck, live snapshots and the Hall of Fame. Single dark look matching the deck. */
:root{
  --night:#161A2E; --night2:#20253F; --night3:#2B3155; --line:#3A4170;

}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;background-image:radial-gradient(circle at 50% -10%,#2A3060 0%,transparent 60%)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{direction:rtl;min-height:100%;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

p{margin:0}

// PSP engine — JS port of score_answers.py + match.py (same math, same constants).
const PSP = (() => {
  const LAYER_WEIGHTS = { types: 0.40, stats: 0.30, evo: 0.18, extra_types: 0.07, dex: 0.05, abilities: 0.0 };
  const SELF_WEIGHT = 0.45;
  const ROLE_WEIGHTS = { self: 0.45, partner: 0.20, family: 0.15, friend: 0.20 };
  const SELF_BOOST = { "stats|hp": 1.5, "stats|special-defense": 1.5, "stats|attack": 0.7, "stats|special-attack": 0.7 };
  const NON_EVOLVING_EVO_SIM = 0.5; // checked on 3,000 simulated people: non-evolving lines win as often as their share of the dex (23.9% vs 23.8%)
  // Paradox Pokémon and Ultra Beasts are near-legendary: they stay in the main pool but need a clear margin to win.
  const PARADOX_PENALTY = (typeof globalThis !== 'undefined' && globalThis.PSP_PARADOX_PENALTY != null) ? globalThis.PSP_PARADOX_PENALTY : 0.05;
  const PARADOX = new Set(['984','985','986','987','988','989','990','991','992','993','994','995','1005','1006','1009','1010','1020','1021','1022','1023',
    /* Ultra Beasts */ '793','794','795','796','797','798','799','803-804','805','806']);

  const sum = a => a.reduce((s, x) => s + x, 0);
  const cosine = (a, b) => {
    const na = Math.sqrt(sum(a.map(x => x * x))), nb = Math.sqrt(sum(b.map(x => x * x)));
    return na && nb ? sum(a.map((x, i) => x * b[i])) / (na * nb) : 0;
  };
  const centeredPos = v => { const m = sum(v) / v.length; return v.map(x => Math.max(0, x - m)); };
  const pearson = (a, b) => {
    const ma = sum(a) / a.length, mb = sum(b) / b.length;
    return cosine(a.map(x => x - ma), b.map(x => x - mb));
  };

  function scoreRater(answers, bank) {
    const items = {}; bank.items.forEach(i => items[i.id] = i);
    const [LO, HI] = bank.scale, sums = {};
    for (const [id, value] of Object.entries(answers || {})) {
      const it = items[id];
      if (!it || it.kind === "bonus" || value === null || value === "" || value === bank.dont_know) continue;
      let v = +value; if (it.key < 0) v = LO + HI - v;
      ((sums[it.layer] ||= {})[it.dim] ||= []).push(v);
    }
    const scores = {};
    for (const [layer, dims] of Object.entries(sums)) {
      scores[layer] = {};
      for (const [d, vs] of Object.entries(dims)) scores[layer][d] = Math.round(sum(vs) / vs.length * 1000) / 1000;
    }
    return scores;
  }

  function raterWeights(raters) {
    if (raters.length && raters.every(r => r.absW != null)) return raters.map(r => r.absW); // fixed final weights (Hall of Fame build-up)
    const others = raters.filter(r => r.role !== "self");
    const hasSelf = raters.some(r => r.role === "self");
    let raw;
    if (others.length && others.every(r => r.weight != null)) raw = others.map(r => +r.weight);
    else {
      const rc = {}; others.forEach(r => rc[r.role] = (rc[r.role] || 0) + 1);
      raw = others.map(r => (ROLE_WEIGHTS[r.role] ?? 0.1) / rc[r.role]);
    }
    const tot = sum(raw) || 1, share = hasSelf ? 1 - SELF_WEIGHT : 1;
    let k = 0;
    return raters.map(r => r.role === "self" ? SELF_WEIGHT : raw[k++] / tot * share);
  }

  const layerVector = (scores, axis, floor) => axis.map(k => +(scores[k] ?? floor));
  // Missing dims stay null: a rater who hasn't answered a dim yet is left out of that dim (matters for partial, mid-evening data).
  const layerVectorN = (scores, axis) => axis.map(k => (k in scores ? +scores[k] : null));

  function aggregate(raters, axes) {
    const bw = raterWeights(raters);
    let floor = Infinity;
    raters.forEach(r => Object.values(r.scores).forEach(L => Object.values(L).forEach(v => { if (v < floor) floor = v; })));
    if (floor === Infinity) floor = 0;
    const out = {};
    for (const [layer, axis] of Object.entries(axes)) {
      const vecs = raters.map(r => layer in r.scores ? layerVectorN(r.scores[layer], axis) : null);
      out[layer] = axis.map((dim, i) => {
        let num = 0, den = 0;
        raters.forEach((r, j) => {
          if (!vecs[j] || vecs[j][i] == null) return;
          let w = bw[j];
          if (r.role === "self") w *= SELF_BOOST[layer + "|" + dim] ?? 1;
          num += w * vecs[j][i]; den += w;
        });
        return den ? num / den : floor;
      });
    }
    return [out, floor];
  }

  function blindSpots(raters, axes, floor, top = 6) {
    const self = raters.find(r => r.role === "self"), others = raters.filter(r => r.role !== "self");
    if (!self || !others.length) return [];
    const gaps = [];
    for (const [layer, axis] of Object.entries(axes)) {
      if (!(layer in self.scores)) continue;
      const s = layerVectorN(self.scores[layer], axis);
      const ov = others.filter(o => layer in o.scores).map(o => layerVectorN(o.scores[layer], axis));
      if (!ov.length) continue;
      axis.forEach((dim, i) => {
        const have = ov.map(v => v[i]).filter(x => x != null);
        if (s[i] == null || !have.length) return;
        const om = sum(have) / have.length;
        gaps.push({ gap: s[i] - om, layer, dim, self: s[i], others: om });
      });
    }
    gaps.sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap));
    return gaps.slice(0, top);
  }

  function buildUser(agg, floor) {
    const u = {};
    u.types = centeredPos(agg.types);
    u.abilities = centeredPos(agg.abilities);
    u.stats = agg.stats;
    const tot = sum(agg.evo);
    u.evo = tot ? agg.evo.map(x => x / tot) : agg.evo;
    const ex = agg.extra_types, hi = Math.max(...ex), span = (hi - floor) || 1;
    const rel = ex.map(x => (x - floor) / span);
    const pulls = centeredPos(rel);
    const strength = Math.min(1, [...rel].sort((a, b) => b - a)[0] - sum(rel) / rel.length);
    u.extra_types = [pulls, strength];
    return u;
  }

  function scoreLine(u, line, prior, dex, evoNeutral) {
    const s = {};
    s.types = cosine(u.types, line.types);
    s.stats = (pearson(u.stats, line.stats) + 1) / 2;
    const [pulls, strength] = u.extra_types;
    const ls = Math.min(1, sum(line.extra_types) / 0.5);
    s.extra_types = 0.5 * cosine(pulls, line.extra_types) + 0.5 * (1 - Math.abs(strength - ls));
    s.evo = line.evo.some(x => x) ? cosine(u.evo, line.evo) : (evoNeutral ?? NON_EVOLVING_EVO_SIM);
    s.abilities = 0; // abilities weigh 0 and are not shipped to the page
    s.dex = dex ? (dex[line.id] || 0) : 0; // share of (weighted) Mew votes for this line's Pokédex statement
    const total = sum(Object.entries(s).map(([k, v]) => LAYER_WEIGHTS[k] * v));
    let rank = total;
    if (prior) { const w = sum(line.types) || 1; rank += LAYER_WEIGHTS.types * sum(prior.map((p, i) => p * line.types[i])) / w; }
    if (PARADOX.has(line.id)) rank -= PARADOX_PENALTY;
    return { total, sims: s, rank };
  }

  function run(profile, E, dex) {
    const ax = E.axes;
    const axes = { types: ax.types, extra_types: ax.types, stats: ax.stats, evo: ax.evo, abilities: ax.abilities };
    let [agg, floor] = aggregate(profile.raters, axes);
    if (!profile.raters.some(r => "extra_types" in r.scores)) {
      const t = agg.types;
      const core = t.map((v, i) => i).sort((a, b) => t[b] - t[a]).slice(0, 2);
      agg.extra_types = t.map((v, i) => core.includes(i) ? floor : v);
    }
    const u = buildUser(agg, floor);
    const prior = ax.types.map(t => E.prior[t] ?? 0);
    const res = E.lines.map(line => ({ line, ...scoreLine(u, line, prior, dex) }));
    res.sort((a, b) => b.rank - a.rank);
    return {
      main: res.filter(r => !r.line.legendary).slice(0, 8),
      top: res.filter(r => !r.line.legendary).slice(0, 20),
      legends: res.filter(r => r.line.legendary).slice(0, 3),
      gaps: blindSpots(profile.raters, { types: ax.types, stats: ax.stats, evo: ax.evo }, floor),
      agg, axes, floor, weights: raterWeights(profile.raters),
    };
  }

})();
if (typeof module !== "undefined") module.exports = PSP;

// ---------- item plan: own random order per participant; scenarios stay whole ----------
function rng(seed){let h=1779033703^seed.length;for(const c of seed){h=Math.imul(h^c.charCodeAt(0),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const PLANS={};
function planFor(pid){
  if(PLANS[pid])return PLANS[pid];
  const units=[],scen={};
  for(const it of BANK.items){
    if(it.kind==='bonus')continue;
    if(it.kind==='scenario'){const k=it.id.split('-')[0];if(!scen[k]){scen[k]=[];units.push({kind:'scenario',key:k,ids:scen[k]})}scen[k].push(it.id)}
    else units.push({kind:'likert',ids:[it.id]});
  }
  const r=rng('psp-'+pid);
  for(let i=units.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[units[i],units[j]]=[units[j],units[i]]}
  const rounds=[[],[],[],[]];let k=0,n=0;
  for(const u of units){if(k<3&&n>=ROUND_SIZE[k]){k++;n=0}rounds[k].push(u);n+=u.ids.length}
  const num={};let c=0;rounds.flat().forEach(u=>u.ids.forEach(id=>num[id]=++c));

}
const countIds=units=>units.reduce((s,u)=>s+u.ids.length,0);
const answeredIn=(units,ans)=>units.reduce((s,u)=>s+u.ids.filter(id=>id in ans).length,0);

// ---------- state ----------
const S={db:null,sample:null,canEdit:false,userReady:false,state:null,setup:null,answers:{},me:store.get('psp-me'),view:'',dex:null,engine:null,sprites:null,slides:null};
const isScreen=()=>['screen','host'].includes((location.hash||'').replace('#',''));

function genderOf(p){if(!p)return null;if(S.intro&&p.id===S.me&&S.intro.g)return S.intro.g;return p.role==='self'?(S.setup?.gender||null):(S.joinedG?.[p.id]||null)}
// ---------- avatars ----------
const AV={'ערי':'eri','דולב':'dolev','רון':'ron','דורון':'doron','ניר':'nir','אייל':'eyal'};
const AVCOL={eri:'#FF7AB6',dolev:'#4FA3FF',ron:'#F4EBD0',doron:'#B57BFF',nir:'#6EE7A0',eyal:'#FFB547'};

const avG=(p,g)=>(g||genderOf(p))==='f'?'-g':'';
function avHead(p,size,ring){const k=avKey(p),sh=ring?`;box-shadow:0 0 0 ${Math.max(2,Math.round(size/14))}px ${ring}`:'';
  return `<span class="avh" style="width:${size}px;height:${size}px${sh}">${k?`<img src="img/av-h-${k}${avG(p)}.webp" alt="${esc(p.name)}">`:`<img src="img/it-poke-ball.webp" alt="" style="object-fit:contain;padding:14%">`}</span>`}

// ---------- progress dial ----------
function progAngle(rounds){let a=0;for(const [d,t] of rounds){if(!t){a+=90;continue}const f=Math.min(1,d/t);a+=90*f;if(f<1)break}return a}
function dialHTML(D,k,o){
  o=o||{};const st=stats(),n=st.length,R=D/2,outer=R*0.86,inner=R*0.3;
  const avs=Math.round(Math.max(24,Math.min(D*0.1,n>1?(outer-inner)/(n-1)*1.7:D*0.09)));
  const top=outer-avs/2-3,bot=inner+avs/2,sp=n>1?(top-bot)/(n-1):0;
  const cur=Math.max(1,Math.min(4,k||1)),lab=o.labelCol||'#161A2E';
  const wedge=(q)=>{const a0=(q*90-90)*Math.PI/180,a1=(q*90)*Math.PI/180;return `M${R} ${R} L${R+outer*Math.cos(a0)} ${R+outer*Math.sin(a0)} A${outer} ${outer} 0 0 1 ${R+outer*Math.cos(a1)} ${R+outer*Math.sin(a1)} Z`};
  let svg=`<svg viewBox="0 0 ${D} ${D}" width="${D}" height="${D}"><circle cx="${R}" cy="${R}" r="${outer+avs*0.15}" fill="#161A2E"/>`;
  for(let q=0;q<4;q++){const f=q+1===cur?'rgba(242,201,76,.18)':q+1<cur?'rgba(255,255,255,.05)':'none';if(f!=='none')svg+=`<path d="${wedge(q)}" fill="${f}"/>`}
  [0,90,180,270].forEach(a=>{const r=a*Math.PI/180;svg+=`<line x1="${R}" y1="${R}" x2="${R+(outer+avs*0.15)*Math.sin(r)}" y2="${R-(outer+avs*0.15)*Math.cos(r)}" stroke="rgba(255,255,255,.28)" stroke-width="${Math.max(1.5,D/300)}"/>`});
  st.forEach((x,i)=>{const r=top-i*sp,C=2*Math.PI*r;svg+=`<circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${Math.max(2,avs*.12)}"/><circle class="arc" data-pid="${esc(x.p.id)}" data-c="${C}" cx="${R}" cy="${R}" r="${r}" fill="none" stroke="${avColor(x.p,i)}" stroke-width="${Math.max(3,avs*.16)}" stroke-linecap="round" stroke-dasharray="0 ${C}" transform="rotate(-90 ${R} ${R})"/>`});
  for(let q=0;q<4;q++){const a=(45+90*q)*Math.PI/180,rr=R*1.18;svg+=`<text x="${R+rr*Math.sin(a)}" y="${R-rr*Math.cos(a)}" fill="${lab}" font-family="Secular One, Rubik, sans-serif" font-size="${Math.round(D*0.05)}" text-anchor="middle" dominant-baseline="middle" opacity="${q+1<=cur?1:.45}">סבב ${q+1}</text>`}
  svg+='</svg>';
  const hands=st.map((x,i)=>{const r=top-i*sp,done=x.rounds[cur-1][0]>=x.rounds[cur-1][1];return `<div class="hand" data-pid="${esc(x.p.id)}" data-r="${r}" data-done="${done?1:0}" style="width:${avs}px;height:${avs}px;margin:${-avs/2}px 0 0 ${-avs/2}px">${avHead(x.p,avs,avColor(x.p,i))}${done?`<span class="ok" style="font-size:${Math.round(avs*.3)}px">✓</span>`:''}</div>`}).join('');
  const doneR=st.filter(x=>x.rounds[cur-1][0]>=x.rounds[cur-1][1]).length;
  return `<div class="dial" style="width:${D}px;height:${D}px">${svg}${hands}<div class="mid"><b style="font-family:var(--pixel);font-size:${Math.round(D*0.075)}px;color:var(--gold);direction:ltr">${doneR}/${n}</b><span style="font-size:${Math.round(D*0.036)}px;color:var(--cream);max-width:${Math.round(inner*2)}px;line-height:1.25">סיימו את סבב ${cur}</span>${o.extra?`<span style="font-size:${Math.round(D*0.03)}px;color:var(--mist);max-width:${Math.round(inner*1.6)}px;line-height:1.25">${o.extra}</span>`:''}</div></div>`;
}
function dialMount(root){
  if(!root)return;S.dialPrev=S.dialPrev||{};S.dialDone=S.dialDone||{};
  const st=stats(),ang={};st.forEach(x=>ang[x.p.id]=progAngle(x.rounds));
  const arcs=[...root.querySelectorAll('.arc')],hands=[...root.querySelectorAll('.hand')];
  const setH=(h,a)=>{h.style.transform=`rotate(${a}deg) translateY(${-h.dataset.r}px) rotate(${-a}deg)`};
  const setA=(c,a)=>{const C=+c.dataset.c;c.setAttribute('stroke-dasharray',`${C*a/360} ${C}`)};
  arcs.forEach(c=>{c.style.transition='none';setA(c,S.dialPrev[c.dataset.pid]||0)});
  hands.forEach(h=>{h.style.transition='none';setH(h,S.dialPrev[h.dataset.pid]||0)});
  root.getBoundingClientRect();
  requestAnimationFrame(()=>{
    arcs.forEach(c=>{c.style.transition='';setA(c,ang[c.dataset.pid]||0)});
    hands.forEach(h=>{h.style.transition='';const id=h.dataset.pid;setH(h,ang[id]||0);const d=h.dataset.done==='1';if(d&&S.dialDone[id]===false)h.classList.add('pop');S.dialDone[id]=d});
    Object.assign(S.dialPrev,ang);
  });
}
function roster(){const r=S.setup?.roster;return r&&r.length?r:[{id:'subj',name:subjectName(),role:'self',weight:45}]}
const person=id=>roster().find(p=>p.id===id);

async function boot(){

  render();

  S.db.doc('setup/main').onSnapshot(s=>{S.setup=s.exists?clone(s.data()):null;changed()},()=>{});
  S.db.collection('joined').onSnapshot(q=>{S.joined=new Set(q.docs.map(d=>d.id));S.joinedLoaded=true;S.joinedG={};q.docs.forEach(d=>{const g=d.data()?.gender;if(g)S.joinedG[d.id]=g});changed()},()=>{});

function phoneView(){
  if(!S.db)return `<p class="eyebrow">PSP · CONNECTING</p><h1>מתחבר לערב…</h1><p class="muted">${S.dbFail?'החיבור נכשל. רעננו את העמוד.':'רגע אחד…'}</p>`;

}

    <button class="btn" data-act="rstart">מתחילים</button>`}
  const me={id:S.rid,name:d.name,role:d.relation||'family'},P=planFor(S.rid),units=P.rounds.flat(),ans=d.answers||{};
  const total=countIds(units),done=answeredIn(units,ans);
  if(done>=total)return `<p class="eyebrow">PSP · CLEAR</p><h1>תודה, ${esc(d.name)}!</h1><div class="card center"><div class="ball wobble" style="--s:110px"></div><p>ענית על כל השאלון. התשובות שלך נשמרו ויישקללו בערב של ${esc(subj)}.</p></div>`;
  const pending=units.filter(u=>u.ids.some(id=>!(id in ans)));
  if(S.view==='review'&&S.reviewUnit)return unitView(S.reviewUnit,me,done,total,true);
  if(S.holdUnit)return unitView(S.holdUnit,me,done,total,false);
  return unitView(pending[0],me,done,total,false);
}

function validateSetup(){
  const d=draft(),errs=[];const names=new Set();
  d.forEach((p,i)=>{const n=(p.name||'').trim();
    if(!n)errs.push(`למשתתף מספר ${i+1} אין שם.`);
    else if(names.has(n)||n===(S.intro?.name||subjectName()))errs.push(`השם "${n}" מופיע פעמיים.`);
    names.add(n);
    if(!(+p.weight>0))errs.push(`ל${n||'משתתף מספר '+(i+1)} יש 0%. אי אפשר לתת 0%, אפשר לפחות 1%.`);
  });
  if(d.length<1)errs.push('צריך לפחות משתתף אחד שעונה עליך.');

let SEQ=[],POS=+(store.get('psp-pos')||0),BUILD=0,SUB=0,HOF=0;

const OAK_STEPS=['oak','gaps','legend'];
async function startScreen(){

  S.slides=sl;S.engine=en;S.sprites=sp;
  SEQ=[];sl.forEach((s,i)=>{SEQ.push({kind:'slide',i,id:s.id});const m=s.id.match(/^x-break-(\d)$/);if(m)SEQ.push({kind:'live',k:+m[1],id:'live-'+m[1]});if(s.id==='x-finale')SEQ.push({kind:'hof',id:'hof'})});
  if(POS>=SEQ.length)POS=0;

function fit(){const c=$('#cv');if(!c)return;const s=Math.min(innerWidth/1920,innerHeight/1080);c.style.transform=`scale(${s})`;c.style.left=(innerWidth-1920*s)/2+'px';c.style.top=(innerHeight-1080*s)/2+'px'}
function onKey(e){
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  if($('#gate')){if(e.key==='Escape'){$('#gate').remove()}e.preventDefault();return}
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','a','A','ש'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='h'||e.key==='H'||e.key==='ח'){const p=$('#panel');p.hidden=!p.hidden;renderPanel()}
  else if(e.key==='f'||e.key==='F'||e.key==='כ'){document.documentElement.requestFullscreen?.().catch(()=>{})}

function cur(){return SEQ[POS]}
function buildOrders(){const els=[...$('#cv').querySelectorAll('[data-build-in],[data-build-out]')];const o=new Set();els.forEach(el=>{['data-build-in','data-build-out'].forEach(a=>{const v=el.getAttribute(a);if(v){const n=+(v.match(/\d+/)||[1])[0];o.add(n)}})});return [...o].sort((a,b)=>a-b)}
function applyBuilds(){
  const orders=buildOrders(),shown=new Set(orders.slice(0,BUILD));
  $('#cv').querySelectorAll('[data-build-in],[data-build-out]').forEach(el=>{
    const bi=el.getAttribute('data-build-in'),bo=el.getAttribute('data-build-out');
    let vis=true;
    if(bi){const n=+(bi.match(/\d+/)||[1])[0];vis=shown.has(n);el.dataset.k=bi.split(' ')[0]}
    if(bo&&vis){const n=+(bo.match(/\d+/)||[1])[0];if(shown.has(n))vis=false}
    el.dataset.b=vis?'show':'hide';
  });
  return orders.length;
}
function show(fresh,atEnd){

    cv.innerHTML=slideHTML(S.slides[it.i].html);cv.firstElementChild?.classList.add('fadein');

    const qr=cv.querySelector('img[alt="QR"]');if(qr)qr.parentElement.outerHTML='<div id="dialbox" style="width:800px;height:800px;margin-inline-start:-40px;flex:none;position:relative;display:flex;align-items:center;justify-content:center"></div>';

}
function go(d){
  if($('#photoov.show')){S.photoHidden=(S.stage?.photo||'')+':'+(S.stage?.at||'');stagePhoto();return}
  const it=cur();if(!it)return;
  if(it.kind==='slide'){
    const n=buildOrders().length;
    if(d>0&&BUILD<n){BUILD++;applyBuilds();return}
    if(d<0&&BUILD>0){BUILD--;applyBuilds();return}
  }
  if(it.kind==='hof'){ if(hofStep(d))return; }
  if(d>0&&it.kind==='slide'&&!S.gateOk){const m=it.id.match(/^x-round-(\d)$/);if(m){const miss=gateMissing(+m[1]);if(miss.length){gateModal(+m[1],miss);return}}}

  POS=np;show(true,d<0);
}

// ---------- results ----------
function profile(){
  const raters=[];
  // host-only preview: the Hall of Fame computed from the remote respondents alone (equal weights, nothing is published)
  if(S.previewRemote){Object.entries(S.remote||{}).forEach(([id,d])=>{const a=d.answers||{};if(Object.keys(a).length)raters.push({pid:id,name:d.name,role:d.relation==='self'?'family':(d.relation||'family'),weight:1,scores:PSP.scoreRater(a,BANK)})});return {raters}}
  for(const p of roster()){
    const a=answersOf(p.id);if(!a||!Object.keys(a).length)continue;
    const r={pid:p.id,name:p.name,role:p.role,scores:PSP.scoreRater(a,BANK)};
    if(p.role!=='self')r.weight=+p.weight||1;
    raters.push(r);
  }
  return {raters};
}
function sprite(line,species){const pid=S.engine.spr[line.id+':'+species]||String(species);return S.sprites[pid]||S.sprites[String(species)]||''}
const spriteURL=b=>b?`data:image/png;base64,${b}`:'';
const BREED={'10250':'Combat','10251':'Blaze','10252':'Aqua'};
const finalName=line=>line.name.split(' → ').pop()+(BREED[line.id]?` (${BREED[line.id]})`:'');
function artAttr(l){const sp=l.species.at(-1),pid=S.engine.spr[l.id+':'+sp]||String(sp),a=S.art&&S.art[pid];return a?`src="data:image/webp;base64,${a}"`:`class="pix" src="${spriteURL(sprite(l,sp))}"`}
function loadArt(){if(S.artLoading)return;S.artLoading=true;S.art={};for(let i=0;i<6;i++)fetch('art'+i+'.json').then(r=>r.json()).then(b=>{Object.assign(S.art,b);if(cur()?.kind==='hof'&&['reveal','legend','map'].includes(HOF_STEPS[HOF]))renderHof()}).catch(()=>{})}
function computeResult(){
  const pr=profile();
  if(!pr.raters.length){S.R=null;return}
  S.R=PSP.run(pr,S.engine,dexVotes(pr.raters));S.R.raters=pr.raters;
}
function dexVotes(raters){
  const ms=S.state?.mew?.statements;if(!ms||!ms.length)return null;
  const w=PSP.raterWeights(raters),line={};ms.forEach(s=>line[s.id]=s.lineId);
  const dex={};raters.forEach((r,i)=>{const v=S.answers[r.pid]?.mew;if(v&&line[v])dex[line[v]]=(dex[line[v]]||0)+w[i]});
  return dex;
}

// ---------- Mew statements: built from the Pokédex entries of the 4 closest lines ----------
async function maybeMew(){
  if(!S.engine||!S.state||S.previewRemote)return;
  const m=S.state.mew,stale=m?.status==='working'&&!S.mewBusy&&(!m.at||Date.now()-Date.parse(m.at)>30000);
  if(m&&m.status!=='none'&&!stale)return;
  // everyone still in the game (anyone who has started answering) must have finished all 150
  const act=stats();if(!act.length||act.some(x=>x.all<150))return;

async function buildMew(){
  S.mewBusy=true;await setState({mew:{status:'working',at:new Date().toISOString()}});
  try{computeResult()}catch(e){S.R=null}if(!S.R){S.mewBusy=false;await setState({mew:{status:'none'}});return}
  const top=S.R.main.slice(0,4).map(t=>({lineId:t.line.id,name:finalName(t.line),entry:flavorOf(t.line)}));
  let texts=null;
  // precomputed library first (all 508 non-legendary lines); the model is only a fallback
  if(!S.mewlib)S.mewlib=await fetch('mew.json').then(r=>r.json()).catch(()=>null);
  if(S.mewlib&&top.every(t=>S.mewlib[t.lineId]))texts=top.map(t=>({statement:S.mewlib[t.lineId][0],entry_he:S.mewlib[t.lineId][1]}));
  if(!texts&&S.sample){
    const prompt=`Below are 4 Pokédex entries (English). For each one return an object with two Hebrew fields:
"statement": ONE short statement in Hebrew (12–22 words) that translates the entry into human terms: what kind of person this would describe. Keep the image and spirit of the entry, but describe a person, not a creature. Do not name the Pokémon, any type, or any Pokémon term. Start with "אדם ש" or a similar natural phrasing.
"entry_he": a faithful, natural Hebrew translation of the original Pokédex entry itself (it may mention the creature; refer to it as "הפוקימון" or by pronoun, not by name).
Return a JSON array of exactly 4 such objects in the same order.
Example: entry "The sprig of green onions it holds is its weapon. It is used much like a metal sword." → {"statement":"אדם שלוקח משהו תמים ויומיומי והופך אותו לנשק, משתמש בו כדי להילחם ולהוכיח את הכוח שלו.","entry_he":"גבעול הבצל הירוק שהוא מחזיק הוא הנשק שלו. הוא משתמש בו כמו בחרב מתכת."}
ENTRIES:
${top.map((t,i)=>`${i+1}. ${t.entry}`).join('\n')}`;
    try{const r=await S.sample.json(prompt,{modelTier:'default'});if(Array.isArray(r)&&r.length===4){texts=r.map(x=>typeof x==='string'?{statement:x}:{statement:String(x.statement||''),entry_he:String(x.entry_he||'')});if(texts.some(x=>!x.statement))texts=null}}catch(e){}
  }
  if(!texts)texts=top.map(t=>({statement:t.entry.replace(new RegExp(t.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'This Pokémon'),entry_he:''}));
  const r=rng('mew'+Date.now());const items=top.map((t,i)=>({id:'m'+(i+1),text:texts[i].statement,entry:t.entry,entryHe:texts[i].entry_he||'',lineId:t.lineId,name:t.name}));
  for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}

  S.mewBusy=false;toast('שאלת הבונוס של מיו נשלחה לטלפונים');
}

// ---------- Hall of Fame dashboard: 4 layer panels + live top list, built up rater by rater ----------
function boardPlan(){
  const full=profile().raters;if(!full.length)return null;
  const w=PSP.raterWeights(full);
  const self=full.map((r,i)=>({r,w:w[i]})).filter(x=>x.r.role==='self');
  const others=full.map((r,i)=>({r,w:w[i]})).filter(x=>x.r.role!=='self').sort((a,b)=>b.w-a.w);
  const order=[...self,...others],n=others.length,hasSelf=self.length>0;
  const ph=[{k:'zero'},{k:'oak'}];
  order.forEach((o,j)=>{const isSelf=o.r.role==='self',num=hasSelf?j:j+1;
    ph.push({k:isSelf?'self':'p',num,upto:j+1,w:o.w,top:isSelf?20:(num===1&&n>2?15:(num>=n-1?5:10))})});
  const ms=S.state?.mew?.statements||[];
  const voters=[];
  if(ms.length){ph.push({k:'mew',upto:order.length,top:4});
    order.forEach((o,j)=>{const v=S.answers[o.r.pid]?.mew;if(v&&ms.find(s=>s.id===v)){voters.push(j);ph.push({k:'vote',upto:order.length,top:4,voter:j,sid:v})}});
    // keep the last vote for the reveal: the board stops one vote short, so the winner is still a surprise
    if(ph[ph.length-1].k==='vote')ph.pop()}
  return {order,ph,n,hasSelf,ms,voters};
}
function boardCompute(B,i){
  const p=B.ph[i];if(!p.upto)return null;
  const raters=B.order.slice(0,p.upto).map(o=>({...o.r,absW:o.w}));
  let dex=null;
  if(p.k==='vote'||p.k==='final'){dex={};const line={};B.ms.forEach(s=>line[s.id]=s.lineId);
    B.ph.slice(0,i+1).forEach(q=>{if(q.k==='vote'){const l=line[q.sid];dex[l]=(dex[l]||0)+B.order[q.voter].w}})}
  return PSP.run({raters},S.engine,dex);
}

  <p class="muted" style="font-size:13px">${S.setup?`המשתתפים הוגדרו: ${roster().map(x=>esc(x.name)+' '+x.weight+'%').join(' · ')}`:'הנבדק עוד לא הגדיר משתתפים בטלפון.'}</p>
  <p class="muted" style="font-size:13px">שאלון מרחוק (${location.origin+location.pathname}#remote): ${Object.values(S.remote||{}).map(r=>{const v=Object.values(r.answers||{}),dk=v.filter(x=>+x===0).length;return esc(r.name)+' '+v.length+'/150'+(r.done?' ✓':'')+(dk?` (${dk} לא יודע/ת)`:'')}).join(' · ')||'עוד אף אחד'}</p>
  <div class="row">${S.previewRemote?`<span class="grow" style="color:var(--gold)">מוצג עכשיו: רק המשיבים מרחוק</span><button class="btn ghost small" data-pa="prevoff">חזרה לנתוני הערב</button>`:`<button class="btn ghost small" data-pa="prevremote" ${Object.keys(S.remote||{}).length?'':'disabled'}>היכל התהילה רק מהמשיבים מרחוק</button>`}</div>
  <table class="prog"><thead><tr><th>משתתף</th>${[1,2,3,4].map(k=>`<th>ס${k}</th>`).join('')}<th>מיו</th></tr></thead><tbody>
  ${st.map(x=>`<tr><td>${esc(x.p.name)}</td>${x.rounds.map(([d,t])=>`<td style="color:${d>=t?'var(--ok)':d?'var(--cream)':'var(--mist)'}">${d}/${t}</td>`).join('')}<td>${x.mew?'✓':'–'}</td></tr>`).join('')}</tbody></table>
  <p class="muted" style="font-size:13px">רק כמויות. מה כל אחד ענה לא מוצג בשום מקום.</p>
  <div class="row"><span class="muted">סבב פתוח: ${open||'אין'}</span>${[1,2,3,4].map(k=>`<button class="btn ghost small" data-pa="open" data-k="${k}">פתיחת ${k}</button>`).join('')}</div>
  <div class="row"><span class="muted">שאלת מיו: ${m?.status==='ready'?'נשלחה':m?.status==='working'?'בבנייה':'עוד לא'}</span><button class="btn ghost small" data-pa="mew">${m?.status==='ready'?'בנייה מחדש':'בנייה עכשיו'}</button></div>
  <div class="row"><label class="muted" for="jump">קפיצה לשקף</label><select id="jump" style="flex:1">${SEQ.map((s,i)=>`<option value="${i}" ${i===POS?'selected':''}>${i+1}. ${s.id}</option>`).join('')}</select></div>
  <div class="row"><button class="btn ghost small" data-pa="demo">מילוי אקראי לבדיקה</button><button class="btn ghost small" data-pa="save">שמירת תוצאות</button><button class="btn red small" data-pa="reset">איפוס הערב</button></div>
  ${S.confirmReset?`<div class="row"><span class="grow">למחוק את כל התשובות, המשתתפים ושאלת מיו?</span><button class="btn red small" data-pa="reset2">כן, למחוק</button><button class="btn ghost small" data-pa="reset0">ביטול</button></div>`:''}`;
  p.onclick=async e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;const a=b.dataset.pa;
    if(a==='close'){p.hidden=true}
    if(a==='subj'){await setState({subject:$('#subjname').value.trim()||'ערי'});toast('נשמר')}
    if(a==='open'){const k=+b.dataset.k;setState({open:k})}
    if(a==='mew'){await setState({mew:{status:'none'}});S.mewBusy=false;buildMew()}
    if(a==='demo')demoFill();
    if(a==='save')saveResults();
    if(a==='prevremote'||a==='prevoff'){S.previewRemote=a==='prevremote';S.oakFor=null;computeResult();const i=SEQ.findIndex(x=>x.id==='hof');if(S.previewRemote&&i>=0){POS=i;HOF=0;SUB=0;show(true)}else if(cur()?.kind==='hof')renderHof();previewBadge();renderPanel()}
    if(a==='reset'){S.confirmReset=true;renderPanel()}
    if(a==='reset0'){S.confirmReset=false;renderPanel()}
    if(a==='reset2'){S.confirmReset=false;await resetAll()}
  };
  p.onchange=e=>{if(e.target.id==='jump'){POS=+e.target.value;show(true)}};
}
async function demoFill(){
  let ros=inRoom();
  if(!S.setup){ros=[{id:'subj',name:subjectName(),role:'self',weight:45},{id:'pdemo1',name:'רון',role:'partner',relation:'בן/בת זוג',weight:20},{id:'pdemo2',name:'אייל',role:'friend',relation:'חבר/ה',weight:12},{id:'pdemo3',name:'דולב',role:'friend',relation:'חבר/ה',weight:12},{id:'pdemo4',name:'דורון',role:'friend',relation:'חבר/ה',weight:11}];await S.db.doc('setup/main').set({roster:ros,demo:true})}
  for(const p of ros){
    const cur=S.answers[p.id]?.answers||{},a={...cur},r=rng('demo-'+p.id+Date.now()),bias={};
    BANK.items.forEach(it=>{if(it.kind==='bonus'||it.id in a)return;bias[it.dim]??=1+r()*4;a[it.id]=Math.max(1,Math.min(5,Math.round(bias[it.dim]+(r()-.5)*2)))});
    const ms=S.state?.mew?.statements;await S.db.doc('answers/'+p.id).set({answers:a,mew:S.answers[p.id]?.mew||(ms?ms[Math.floor(r()*ms.length)].id:''),demo:true,at:new Date().toISOString()});
  }
  toast('מולא לבדיקה. שאלת מיו תיבנה עכשיו.');
}
// a snapshot of everything, kept in Firestore (the reset never touches 'archive') and downloaded as a file
async function saveResults(){
  let R=null;try{computeResult();R=S.R?{main:S.R.main.map(t=>({line:t.line.id,name:t.line.name,total:t.total,sims:t.sims})),legends:S.R.legends.map(t=>({line:t.line.id,name:t.line.name,total:t.total})),gaps:S.R.gaps}:null}catch(e){}
  const snap=clone({at:new Date().toISOString(),subject:subjectName(),state:S.state,setup:S.setup,answers:S.answers,remote:S.remote||{},result:R});
  try{await S.db.doc('archive/'+snap.at.replace(/[:.]/g,'-')).set(snap);toast('התוצאות נשמרו')}catch(e){toast('השמירה בענן נכשלה, הקובץ יורד בכל זאת')}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snap,null,1)],{type:'application/json'}));a.download=`psp-${snap.at.slice(0,16).replace(/[:T]/g,'-')}.json`;document.body.appendChild(a);a.click();a.remove();
}
function previewBadge(){let b=$('#prevbadge');if(!S.previewRemote){b?.remove();return}if(!b){b=document.createElement('div');b.id='prevbadge';b.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:50;background:#E4483F;color:#fff;font:600 15px var(--body);padding:6px 14px;border-radius:999px';document.body.append(b)}b.textContent='תצוגה מקדימה: רק המשיבים מרחוק · לא נשלח לטלפונים'}
async function resetAll(){
  for(const id of Object.keys(S.answers))await S.db.doc('answers/'+id).delete().catch(()=>{});
  await S.db.doc('setup/main').delete().catch(()=>{});
  for(const id of [...(S.joined||[])])await S.db.doc('joined/'+id).delete().catch(()=>{});S.lobbyShown=new Set();
  await setState({open:0,closed:[],result:null,revealed:false,mew:{status:'none'}});
  S.answers={};S.ai='';S.tgrid=null;toast('הערב אופס');renderPanel();
}
boot();
</script>
