<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="יש לך דואר. דרגונייט כבר בדרך.">
<meta property="og:description" content="הזמנה אישית מהאוניברסיטה הפוקימונית · PSP">

<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<script src="config.js"></script>
<script src="strings.js"></script>
<style>
:root{--night:#161A2E;--cream:#F6F1E7;--gold:#F2C94C;--red:#E4483F;--sky:#6FC3E8;--ok:#5BC48A;--line:#3A4170;--mist:#B9BDD6;
  --pixel:'Press Start 2P',monospace;--display:'Secular One','Rubik',Arial,sans-serif;--body:'Rubik',Arial,sans-serif;--z:3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--body)}
body{overflow-x:hidden}
img,.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;cursor:pointer}
#sky{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1px 1px at 12% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 78% 12%,#fff 99%,transparent),
  radial-gradient(2px 2px at 30% 40%,#B9BDD6 99%,transparent),radial-gradient(1px 1px at 88% 46%,#fff 99%,transparent),
  radial-gradient(2px 2px at 62% 24%,#fff 99%,transparent),radial-gradient(1px 1px at 8% 70%,#B9BDD6 99%,transparent),
  radial-gradient(1px 1px at 46% 8%,#fff 99%,transparent),radial-gradient(2px 2px at 92% 78%,#B9BDD6 99%,transparent),
  radial-gradient(circle at 50% 120%,#2D3468 0%,var(--night) 62%)}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.hide{display:none!important}
/* top bar */
#bar{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline:12px;display:flex;justify-content:space-between;z-index:40;pointer-events:none}
#bar button{pointer-events:auto;background:rgba(22,26,46,.75);color:var(--mist);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:400 10px/1 var(--pixel)}
#bar button[aria-pressed="false"]{opacity:.55}
/* start */
#start{gap:26px;text-align:center}
#start .logo{font:400 calc(var(--z)*10px)/1 var(--pixel);color:var(--gold);letter-spacing:4px;text-shadow:0 4px 0 #8a6a14}
#start .sub{font:400 12px/1.6 var(--pixel);color:var(--mist)}
#start .ps{font:400 16px/1 var(--pixel);color:var(--cream);animation:blink 1.1s steps(2) infinite;margin-top:14vh}
@keyframes blink{50%{opacity:0}}
/* dragonite */
#arrive{justify-content:flex-end;padding-bottom:max(28px,env(safe-area-inset-bottom))}
#shadow{position:fixed;top:18%;left:0;width:calc(var(--z)*204px);height:calc(var(--z)*180px);background-repeat:no-repeat;filter:brightness(0);opacity:0;transform:translateX(110vw)}
#shadow.go{animation:shadow 1.15s cubic-bezier(.4,0,.6,1) forwards}
@keyframes shadow{0%{transform:translate(110vw,6vh) scaleX(-1);opacity:0}12%{opacity:.55}88%{opacity:.55}100%{transform:translate(-110vw,-8vh) scaleX(-1);opacity:0}}
#dnwrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
#dn{width:calc(var(--z)*102px);height:calc(var(--z)*90px);background-repeat:no-repeat;transform:translateY(-120vh);will-change:transform;position:relative}
#dn.land{transition:transform 1.5s cubic-bezier(.2,.75,.3,1)}
#dn.down{transform:translateY(0)}
#dn .hit{position:absolute;left:0;top:calc(var(--z)*30px);width:calc(var(--z)*34px);height:calc(var(--z)*34px);border:0;background:none;padding:0}
#ground{width:calc(var(--z)*70px);height:calc(var(--z)*7px);border-radius:50%;background:rgba(0,0,0,.35);margin-top:calc(var(--z)*-6px);opacity:0;transition:opacity .8s .9s}
#ground.on{opacity:1}
.dust{position:absolute;bottom:calc(var(--z)*2px);width:calc(var(--z)*3px);height:calc(var(--z)*3px);background:var(--mist);animation:dust .6s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),calc(var(--z)*-6px));opacity:0}}
/* dialog boxes (from the evening: .lkbox / .gbp-box) */
.lkbox{width:min(100%,460px);background:#FFFDF8;border:5px solid var(--night);border-radius:12px;box-shadow:inset 0 0 0 4px #FFFDF8,inset 0 0 0 7px #9FA7C7;padding:16px 18px;color:var(--night);font:500 17px/1.5 var(--body);position:relative}
.lkbox .hint{display:block;margin-top:6px;font:400 10px/1.6 var(--pixel);color:#E4483F;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.gbp-box{width:min(100%,460px);background:#F8F8F8;color:#1E2238;border:4px solid #2A2E45;border-radius:10px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #6A8CC8;position:relative;min-height:112px;padding:14px 18px 28px;font:500 18px/1.55 var(--body);white-space:pre-line}
.gbp-tri{position:absolute;inset-inline-end:14px;bottom:6px;color:#E4483F;font-style:normal;font-size:16px;animation:blink 1s steps(2) infinite}
.gbp-menu{width:min(100%,460px);background:#F8F8F8;color:#1E2238;border:4px solid #2A2E45;border-radius:10px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #6A8CC8;padding:6px}
.gbp-menu>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#1E2238;font:500 20px/1.2 var(--body);padding:12px 14px;text-align:start}
.gbp-menu>button::before{content:'▶';font-size:14px;opacity:0}
[dir=rtl] .gbp-menu>button::before{content:'◀'}
.gbp-menu>button:first-child::before,.gbp-menu>button:focus-visible::before,.gbp-menu>button:active::before{opacity:1}
/* envelope */
#env{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(22,26,46,.78);z-index:20}
#env .wrap{position:relative;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
#env .seal{position:absolute;border:0;padding:0;background:none}
#env .seal img{width:100%;height:100%;display:block}
#env .seal.shake{animation:sshake .5s ease-in-out 2}
@keyframes sshake{25%{transform:rotate(-18deg)}75%{transform:rotate(14deg)}}
#env .wrap.gone{transition:transform .6s ease-in,opacity .6s;transform:translateY(40vh) scale(.6);opacity:0}
.flash{position:fixed;inset:0;background:#fff;z-index:60;animation:flash .7s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
/* hologram */
#holo{justify-content:flex-end;gap:14px}
#hstage{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#beam{position:absolute;bottom:calc(var(--z)*5px);width:calc(var(--z)*70px);height:calc(var(--z)*96px);clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);background:linear-gradient(0deg,rgba(111,195,232,.55),rgba(111,195,232,.06));transform-origin:50% 100%;transform:scaleY(0);transition:transform .7s ease-out}
#beam.on{transform:scaleY(1)}
#scan{position:absolute;bottom:calc(var(--z)*5px);width:calc(var(--z)*70px);height:calc(var(--z)*96px);clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);background:repeating-linear-gradient(0deg,rgba(22,26,46,.42) 0 2px,transparent 2px 5px);z-index:2;pointer-events:none;opacity:0;transition:opacity .6s .4s;animation:scanmove 1.6s linear infinite}
#scan.on{opacity:1}
@keyframes scanmove{to{background-position:0 -10px}}
#oak{position:relative;width:calc(var(--z)*33px);height:calc(var(--z)*73px);margin-bottom:calc(var(--z)*12px);opacity:0;transition:opacity .6s .5s}
#oak.on{opacity:1}
#oak img{width:100%;height:100%;display:block;filter:sepia(1) hue-rotate(160deg) saturate(2.6) brightness(1.15);opacity:.88}
#oak.on{animation:jitter 2.4s steps(1) infinite}
@keyframes jitter{0%,100%{transform:none;filter:none}8%{transform:translateX(calc(var(--z)*1px))}10%{transform:none}46%{transform:translateX(calc(var(--z)*-1px));opacity:.7}48%{transform:none;opacity:1}72%{transform:skewX(4deg)}73%{transform:none}}
#disc{width:calc(var(--z)*20px);height:calc(var(--z)*7px);display:block}
/* letter */
#letter{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:block;padding:max(54px,calc(env(safe-area-inset-top) + 44px)) 16px max(40px,env(safe-area-inset-bottom))}
#letter .col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.paper{background:var(--cream);color:#1E2238;border-radius:6px;padding:22px 20px;box-shadow:0 0 0 4px #1E2238,0 0 0 8px var(--gold),0 12px 30px rgba(0,0,0,.5);animation:rise .6s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.paper .kick{font:400 9px/1.7 var(--pixel);color:#6A6F8A;margin:0}
.paper h1{font:400 34px/1.15 var(--display);margin:6px 0 14px;color:#1E2238}
.paper p{font-size:17px;line-height:1.6;margin:0 0 12px}
.paper .to{font-weight:700}
.paper .sign{white-space:pre-line;font-weight:500;margin-top:16px}
.paper .stamp{float:inline-end;width:calc(var(--z)*18px);margin:-4px 0 4px 10px}
.blk{background:#F8F8F8;color:#1E2238;border:4px solid #2A2E45;border-radius:10px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #6A8CC8;padding:16px 18px}
.blk h2{font:400 22px/1.2 var(--display);margin:0 0 12px}
.save{direction:ltr;font:400 12px/2.2 var(--pixel)}
.save .row{display:flex;justify-content:space-between;gap:12px}
.save .row b{font-weight:400;color:#3B4AA0}
.save .row b.nm{font:700 17px/1.6 var(--body);unicode-bidi:plaintext}
.save .t{font:400 12px/1 var(--pixel);margin:0 0 10px;color:#1E2238}
.bag .it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed #C9CEE4}
.bag .it:first-of-type{border-top:0}
.bag .ic{flex:none;min-width:44px;display:grid;place-items:center}
.bag b{display:block;font-size:17px}
.bag span{font-size:15px;line-height:1.5;color:#4A4F6A}
.phone{display:block;width:26px;height:44px;border:4px solid #2A2E45;border-radius:7px;background:linear-gradient(#6FC3E8,#6FC3E8) 50% 40%/14px 22px no-repeat,#F8F8F8;position:relative}.phone::after{content:'';position:absolute;left:50%;bottom:3px;width:6px;height:3px;margin-left:-3px;background:#2A2E45;border-radius:2px}
.bag .ic.friends{display:flex;gap:0}.friends img{zoom:2;margin-inline-start:-4px}
.slots{display:flex;gap:6px;margin:6px 0 4px}
.slot{width:30px;height:30px;border-radius:50%;border:3px dashed #9FA7C7;display:grid;place-items:center}
.notes ul{margin:0;padding:0;list-style:none}
.notes li{position:relative;padding-inline-start:20px;margin:0 0 10px;font-size:16px;line-height:1.5}
.notes li::before{content:'▸';position:absolute;inset-inline-start:0;color:#E4483F}
[dir=rtl] .notes li::before{content:'◂'}
/* pages */
.tabs{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F8F8F8;color:#1E2238;border:4px solid #2A2E45;border-radius:10px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #6A8CC8;padding:8px 6px}
.tarr{background:none;border:0;color:#E4483F;font-size:20px;padding:6px 12px}
.tmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.tmid b{font:400 22px/1 var(--display)}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;padding:0;border-radius:50%;border:2px solid #2A2E45;background:transparent}
.dot.on{background:#E4483F;border-color:#E4483F}
#pg{display:flex;flex-direction:column;gap:18px}
#pg.in-next{animation:inn .28s ease-out}#pg.in-prev{animation:inp .28s ease-out}
@keyframes inn{from{transform:translateX(calc(var(--d,1)*-24px));opacity:0}}
@keyframes inp{from{transform:translateX(calc(var(--d,1)*24px));opacity:0}}
[dir=ltr] #pg{--d:-1}
.nextbtn{align-self:center;background:var(--gold);color:#1E2238;border:0;border-radius:12px;padding:12px 26px;font:700 18px/1 var(--body);box-shadow:0 4px 0 #8a6a14}
.nextbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a14}
.paper .whn{background:rgba(242,201,76,.25);border-radius:6px;padding:8px 10px}
.paper .ps{margin-top:14px;padding-top:12px;border-top:2px dashed #C9CEE4;font-size:16px;line-height:1.55;white-space:pre-line}
.bag .it{flex-wrap:wrap}.bag .it>div:not(.ic){flex:1;min-width:0}
.more{flex-basis:100%;margin-top:2px}
.more summary{display:inline-flex;align-items:center;gap:6px;list-style:none;cursor:pointer;color:#E4483F;font-weight:700;font-size:15px;padding:4px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'▾';font-size:13px;transition:transform .2s}
.more[open] summary::after{transform:rotate(180deg)}
.more ul{margin:6px 0 2px;padding:10px 12px;list-style:none;background:#EEF1FA;border-radius:8px}
.more li{position:relative;padding-inline-start:16px;margin:0 0 7px;font-size:15px;line-height:1.5;color:#2A2E45}
.more li:last-child{margin-bottom:0}
.more li::before{content:'▸';position:absolute;inset-inline-start:0;color:#6A8CC8}
[dir=rtl] .more li::before{content:'◂'}
/* the answer */
.savedtag{display:inline-block;background:var(--ok);color:#0b2b17;border-radius:8px;padding:4px 10px;font-weight:700;margin:0 0 10px!important}
.todo{margin:0;padding:0;list-style:none;counter-reset:t;text-align:start}
.todo li{counter-increment:t;position:relative;padding:10px 0 10px;padding-inline-start:40px;border-top:2px dashed #C9CEE4}
.todo li:first-child{border-top:0}
.todo li::before{content:counter(t);position:absolute;inset-inline-start:0;top:10px;width:28px;height:28px;border-radius:50%;background:#E4483F;color:#fff;display:grid;place-items:center;font:400 12px/1 var(--pixel)}
.todo b{display:block;font-size:17px}
.todo span{display:block;font-size:15px;line-height:1.5;color:#4A4F6A}
.todo .wa{margin-top:8px}
.conf h2{font-size:22px}
.conf-l{margin:0;padding:0;list-style:none;text-align:start}
.conf-l li{position:relative;padding-inline-start:22px;margin:0 0 8px;font-size:16px;line-height:1.5}
.conf-l li::before{content:'✓';position:absolute;inset-inline-start:0;color:var(--ok);font-weight:700}
.faqm>button{font-size:17px;padding:11px 12px;border-top:1px dashed #C9CEE4}
.faqm>button:first-child{border-top:0}
.faqm>button::before{opacity:.35}
.oakq{display:flex;align-items:flex-end;gap:10px}
.oakq img{width:66px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.oakq .gbp-box{min-height:0;padding-bottom:16px;font-size:17px}
.oakq .q{display:block;color:#3B4AA0;margin-bottom:6px}
/* page 1: the trainer card */
.tcard{position:relative;background:linear-gradient(160deg,#5DA9E9,#3A78C8);border:4px solid #1E2238;border-radius:14px;box-shadow:inset 0 0 0 4px #9CD0F8,0 10px 24px rgba(0,0,0,.45);padding:12px 14px 14px;color:#fff;direction:ltr}
.tchead{display:flex;justify-content:space-between;font:400 11px/1 var(--pixel);text-shadow:0 2px 0 #1E3A70;margin-bottom:12px}
.tcbody{display:flex;gap:12px;align-items:stretch}
.tcrows{flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.92);border-radius:8px;padding:10px 12px;color:#1E2238}
.tcrows div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:400 10px/1.3 var(--pixel)}
.tcrows b{font:400 11px/1.3 var(--pixel);color:#3B4AA0}
.tcrows b.nm{font:700 16px/1.2 var(--body);unicode-bidi:plaintext;text-align:end}
.tcfig{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.7);border-radius:10px;padding:6px 4px;color:#fff}
.tcfig img{zoom:3}
.tcfig i{font:500 12px/1.2 var(--body);font-style:normal;text-align:center}
.cust{display:grid;place-items:center;width:58px;height:70px;font:400 30px/1 var(--pixel);color:#fff;background:rgba(30,34,56,.35);border-radius:8px}
.tcbl{margin:12px 0 6px;font:500 13px/1.3 var(--body);text-align:center;direction:rtl}
html[lang=en] .tcbl{direction:ltr}
.tcbadges{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:rgba(30,34,56,.35);border-radius:10px;padding:6px}
.tcbadges img{width:100%;aspect-ratio:1;object-fit:contain;filter:grayscale(1) brightness(.35);opacity:.6}
.tcbadges img.on{filter:none;opacity:1;animation:pop .4s ease-out}
.approved{position:absolute;inset-inline-end:10px;bottom:56px;transform:rotate(-10deg);font:400 14px/1 var(--pixel);color:#E4483F;border:3px solid #E4483F;border-radius:6px;padding:6px 8px;background:rgba(255,255,255,.85)}
.blk h2+.muted,.muted{color:#6A6F8A;font-size:14px;margin:-6px 0 10px}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;max-height:330px;overflow-y:auto;padding:2px}
.pgrid button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:62px;background:#EEF1FA;border:2px solid transparent;border-radius:10px;padding:3px 0}
.pgrid button.on{border-color:var(--gold);background:#FFF4CC}
.pgrid img{zoom:2}
.pgrid .custt{grid-column:1/-1;min-height:46px;background:#2A2E45;color:#fff;flex-direction:row;align-items:center;gap:10px;justify-content:center}.pgrid .custt.on{background:#3B4AA0}
.pgrid .custt span{font:400 16px/1 var(--pixel)}
.pgrid .custt i{font:600 16px/1 var(--body);font-style:normal}
/* page 2: the town map */
.maplead{margin:0;text-align:center;color:var(--mist);font-size:15px;line-height:1.5}
.tmap{position:relative;align-self:center;border:4px solid #2A2E45;border-radius:8px;box-shadow:0 0 0 3px #9FA7C7,0 10px 24px rgba(0,0,0,.45);box-sizing:content-box;overflow:hidden;direction:ltr}
.tmap>img{width:100%;height:100%;display:block}
.mk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid transparent;box-sizing:border-box}
.mk.seen{border-color:var(--gold)}
.mk.now{border-color:#fff;box-shadow:0 0 0 3px var(--gold);animation:pulse 1.2s ease-in-out infinite}
.dnic{position:absolute;width:32px;height:32px;margin:-26px 0 0 -16px;background:url(img/dn-icon.png) 0 0/64px 32px;image-rendering:pixelated;transform:scaleX(calc(var(--fx,1)*-1));animation:dnf .3s steps(1) infinite;pointer-events:none;z-index:2}
@keyframes dnf{50%{background-position:-32px 0}}
.stopbox{min-height:0;padding-bottom:16px}
.stopbox .sbadge{float:inline-end;width:40px;height:40px;object-fit:contain;margin:0 0 4px 8px}
.mapbtns{display:flex;justify-content:center}
/* page 3: the bag */
.bagl{display:flex;flex-direction:column;gap:4px}
.bagl button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:8px 6px;text-align:start;color:#1E2238}
.bagl button::before{content:'▶';font-size:12px;color:#E4483F;opacity:0}
[dir=rtl] .bagl button::before{content:'◀'}
.bagl button.on{background:#EEF1FA}
.bagl button.on::before{opacity:1}
.bagl .bi{width:62px;display:flex;justify-content:center}
.bagl b{flex:1;font-size:17px}

@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-22deg)}30%{transform:rotate(18deg)}45%{transform:rotate(-12deg)}60%{transform:rotate(6deg)}75%{transform:rotate(0)}}
#ballsay{min-height:0}
.res{text-align:center}
.res h2{font:400 26px/1.2 var(--display);margin:0 0 8px}
.res p{margin:0 0 10px;font-size:16px;line-height:1.5}
.wa{display:inline-block;margin-top:6px;background:#25D366;color:#0b2b17;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none}
.linkbtn{background:none;border:0;color:#6A6F8A;text-decoration:underline;font-size:14px;margin-top:6px}
html[lang=he] #start .sub,html[lang=he] .lkbox .hint,html[lang=he] .paper .kick,html[lang=he] .save .t,html[lang=he] .bwrap small{font-family:var(--body);font-weight:500;letter-spacing:0}
html[lang=he] #start .sub{font-size:18px}html[lang=he] .lkbox .hint{font-size:15px}html[lang=he] .paper .kick{font-size:13px}html[lang=he] .save .t{font-size:18px;font-weight:700}html[lang=he] .bwrap small{font-size:14px}
@media (prefers-reduced-motion:reduce){
  #start .ps,.lkbox .hint,.gbp-tri{animation:none}
  #oak.on,.ball.wobble,.paper,#env .wrap,#scan,.mk.now,.dnic,.evodn,.tcbadges img.on{animation:none}
  .bmc,.bmc.in{transition:none}
  #dn.land,#beam,#oak{transition:none}
}
</style>
</head>
<body>
<div id="sky"></div>
<div id="bar"><button id="snd" aria-pressed="true">♪</button><button id="skip" class="hide"></button></div>

<section class="scene" id="start" role="button" tabindex="0">
  <div class="logo">PSP</div>
  <div class="sub" id="startSub"></div>
  <div class="ps" id="ps">PRESS START</div>
</section>

<section class="scene hide" id="who" style="justify-content:center;gap:12px;overflow-y:auto"></section>
<section class="scene hide" id="arrive">
  <div id="shadow"></div>
  <div id="cut" class="hide"><video id="cutv" muted playsinline preload="auto"></video><p id="cutt"></p></div>
  <div id="dnwrap"><div style="display:flex;flex-direction:column;align-items:center"><div id="dn" class="px"><button class="hit" id="dnhit" aria-label="envelope"></button></div><div id="ground"></div></div></div>
  <div class="lkbox hide" id="arrbox"></div>
</section>

<div id="env" class="hide"><div class="wrap"><img id="envimg" src="img/envelope.png" alt="" class="px"><button class="seal" id="seal"><img src="img/seal.png" alt="" class="px"></button></div><div class="lkbox" style="width:auto" id="envbox"></div></div>

<section class="scene hide" id="holo">
  <div id="hstage"><div id="beam"></div><div id="scan"></div><div id="oak"><img src="img/oak.png" alt=""></div><img id="disc" src="img/disc.png" alt="" class="px"></div>
  <div class="gbp-box" id="oakbox"><span id="oaktxt"></span><i class="gbp-tri" id="oaktri">▼</i></div>
</section>

<section id="letter" class="hide"><div class="col" id="lcol"></div></section>
<div id="evo" class="hide"><div id="evostage"></div><div class="gbp-box" id="evotxt"></div></div>

<script>
(()=>{
const Q=new URLSearchParams(location.search);
const LANG=Q.get('lang')==='en'?'en':'he';let G=Q.get('g')==='f'?'f':'m';
const TX=(window.INV_TEXT||{})[LANG]||{}, CFG=window.INV_CFG||{};
const ROLE=Q.get('r')==='f'?'f':'s', BY=(Q.get('by')||'').trim().slice(0,40), BG=Q.get('bg')==='f'?'f':'m';
// a friend sees the f_ version of a text when there is one
let REMOTE=false;
const RK=k=>REMOTE&&TX['r_'+k]!==undefined?'r_'+k:ROLE==='f'&&TX['f_'+k]!==undefined?'f_'+k:k, TXR=k=>TX[RK(k)];
const HOST=(CFG.host||{})[LANG]||'';
const pick=v=>v&&typeof v==='object'&&!Array.isArray(v)?(v[G]??v.m??''):v;
let NAME=(Q.get('to')||'').trim().slice(0,40);
if(!NAME)NAME=pick(TX.defaultName)||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill=s=>String(s??'').replace(/\{s:([^|}]*)\|([^}]*)\}/g,(m,a,b)=>BG==='f'?b:a).replace(/\{name\}/g,NAME).replace(/\{host\}/g,HOST).replace(/\{by\}/g,BY);
const T=k=>fill(pick(TXR(k)));                       // plain text
const H=k=>esc(T(k)).replace(/\n/g,'<br>');         // as HTML
const TL=k=>(TXR(k)||[]).map(v=>fill(pick(v)));      // a list
document.documentElement.lang=LANG;document.documentElement.dir=LANG==='he'?'rtl':'ltr';document.title=TX.title||document.title;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,120):ms));

// remembered per person and language: seen the intro, and the answer
const GIID=(Q.get('i')||'').replace(/[^a-z0-9]/g,'').slice(0,24),GROUP=ROLE==='f'&&!Q.get('to')&&!!GIID;
const KEY=GROUP?'psp-invite:'+LANG+':g:'+GIID:ROLE==='f'?'psp-invite:'+LANG+':f:'+BY+':'+NAME:'psp-invite:'+LANG+':'+NAME+(GIID?':'+GIID:'');
if(Q.get('reset')){try{Object.keys(localStorage).filter(k=>k.startsWith('psp-invite')).forEach(k=>localStorage.removeItem(k))}catch(e){}Q.delete('reset');history.replaceState(null,'',location.pathname+(Q.toString()?'?'+Q.toString():''))}
const mem=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}};

// pixel scale: whole numbers only
function scale(){const z=Math.max(2,Math.min(4,Math.floor(Math.min(innerWidth-24,460)/102)));document.documentElement.style.setProperty('--z',z);return z}
let Z=scale();addEventListener('resize',()=>{Z=scale();sizeEnv()});

// sound: nothing plays before the first tap
const SND={cry:'snd/dn-cry.mp3',a:'../sfx-a.mp3',tink:'../sfx-tink.mp3',poof:'../sfx-ball-poof.mp3',caught:'../sfx-caught-mon.mp3',denied:'../sfx-denied.mp3',page:'../sfx-dex-page-added.mp3',toss:'../sfx-ball-toss.mp3'};
const A={};let soundOn=(()=>{try{return localStorage.getItem('psp-invite-snd')!=='0'}catch(e){return true}})(),music=null;
let AC=null;const BUF={};
function unlock(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,1,22050),s0=AC.createBufferSource();s0.buffer=b;s0.connect(AC.destination);s0.start(0);
    Object.entries(SND).forEach(([k,src])=>fetch(src).then(r=>r.arrayBuffer()).then(x=>new Promise((ok,no)=>AC.decodeAudioData(x,ok,no))).then(d=>{BUF[k]=d}).catch(()=>{}))}
  if(AC.state==='suspended')AC.resume()}catch(e){}
  if(!music){music=new Audio(musSrc());music.loop=true;music.volume=.3;music.muted=true;const p=music.play();if(p&&p.then)p.then(()=>{music.pause();music.muted=false}).catch(()=>{music.muted=false})}}
function sfx(k,vol){if(!soundOn||!AC||!BUF[k])return;try{if(AC.state==='suspended')AC.resume();const s1=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol??.8;s1.buffer=BUF[k];s1.connect(g);g.connect(AC.destination);s1.start(0)}catch(e){}}
// wait (briefly) for a sound that may still be loading, then play it
async function sfxSoon(k,vol){for(let i=0;i<16&&!BUF[k];i++)await new Promise(r=>setTimeout(r,60));sfx(k,vol)}
// Cherrygrove City (HeartGold/SoulSilver) for the invitation; after yes, the menu plays Global Trade Station, the same as the evening's lobby
function musSrc(){return mem.ans==='yes'?'../mus-gts.mp3':'../mus-cherrygrove.mp3'}
function mus(on){if(!music)return;const want=musSrc();if(!music.src.endsWith(want.slice(2))){music.pause();music.src=want;music.loop=true}if(on&&soundOn){music.play().catch(()=>{})}else music.pause()}
const sndBtn=$('#snd');sndBtn.setAttribute('aria-pressed',soundOn);sndBtn.title=T('sound');
sndBtn.onclick=e=>{e.stopPropagation();soundOn=!soundOn;sndBtn.setAttribute('aria-pressed',soundOn);try{localStorage.setItem('psp-invite-snd',soundOn?'1':'0')}catch(x){}if(!soundOn&&music)music.pause();else if(scene==='holo'||scene==='letter')mus(true)};

let scene='start';
function show(id){$('#who')?.classList.add('hide');['start','arrive','holo'].forEach(s=>$('#'+s).classList.toggle('hide',s!==id));$('#letter').classList.toggle('hide',id!=='letter');scene=id}

// Dragonite's frames: 56 frames of 102 x 90 in an 8-column sheet
const DN={fw:102,fh:90,n:56,cols:8};let dnT=null,dnK=0;
function dnSheet(src){const d=$('#dn');d.style.backgroundImage=`url(${src})`;d.style.backgroundSize=`${DN.cols*DN.fw*Z}px ${Math.ceil(DN.n/DN.cols)*DN.fh*Z}px`}
function dnRun(){clearInterval(dnT);const tick=()=>{const k=dnK%DN.n;$('#dn').style.backgroundPosition=`${-(k%DN.cols)*DN.fw*Z}px ${-Math.floor(k/DN.cols)*DN.fh*Z}px`;if(!RM)dnK++};tick();dnT=setInterval(tick,100)}

// ---------- 1. PRESS START ----------
$('#startSub').textContent=T('startSub');$('#ps').textContent=T('pressStart');
const skipBtn=$('#skip');skipBtn.textContent=T('skip');
skipBtn.onclick=e=>{e.stopPropagation();unlock();toLetter(true)};
function begin(){if(scene!=='start')return;unlock();if(mem.seen)skipBtn.classList.remove('hide');if(GROUP&&!mem.me){pickWho();return}arrive()}
// the group link: "who is opening the invitation?", names from the subject's list, or a name of your own
async function pickWho(){scene='who';['start','arrive','holo'].forEach(x=>$('#'+x).classList.add('hide'));const w=$('#who');w.classList.remove('hide');
  w.innerHTML=`<div class="gbp-box" style="min-height:0;padding-bottom:16px"><b class="q">${H('pickTitle')}</b>${H('pickLead')}</div><div class="gbp-menu" id="whol"><p class="muted" style="margin:10px 14px">${H('pickLoading')}</p></div>`;
  let team={};try{const db=await dbReady;if(db){const d=await db.doc('invites/'+IID).get();if(d.exists)team=d.data().team||{}}}catch(e){console.warn('pick',e)}
  const L=Object.entries(team).filter(([k,v])=>v&&v.n&&v.ans!=='removed').sort((a,b)=>String(a[1].n).localeCompare(String(b[1].n)));
  $('#whol').innerHTML=L.map(([k,v])=>`<button data-k="${esc(k)}">${esc(v.n)} ${v.g==='f'?'♀':'♂'}${v.ans==='yes'?' ✓':''}${v.r?` · ${H('remoteTag')}`:''}</button>`).join('')+`<button data-k="">${H('pickOther')}</button>`;
  $('#whol').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sfx('a',.5);const k=b.dataset.k;if(k){const v=team[k];choose(v.n,v.g==='f'?'f':'m',k,!!v.r);return}
    let g='m';w.insertAdjacentHTML('beforeend',`<div class="blk addf" style="margin-top:12px;width:min(100%,460px)"><label for="pname">${H('pickName')}</label><input id="pname" maxlength="30" autocomplete="off"><div class="gsel" style="margin-top:10px"><button data-g="m" class="on">${H('boy')}</button><button data-g="f">${H('girl')}</button></div><button class="nextbtn wbtn" id="pgo">${H('pickGo')} ${AR_NEXT}</button></div>`);
    w.querySelectorAll('.gsel [data-g]').forEach(x=>x.onclick=()=>{g=x.dataset.g;w.querySelectorAll('.gsel [data-g]').forEach(y=>y.classList.toggle('on',y===x))});$('#pname').focus();
    $('#pgo').onclick=()=>{const n=($('#pname').value||'').trim().slice(0,30);if(!n){$('#pname').classList.add('bad');return}choose(n,g,rid(8))}})}
function choose(n,g,k,r){NAME=n;G=g;FKEY=k;REMOTE=!!r;mem.me={n,g,k,r:r?1:0};save();watchFile();$('#who').classList.add('hide');arrive()}
$('#start').addEventListener('click',begin);$('#start').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')begin()});

// ---------- 2. Dragonite arrives ----------
// a short anime cut: Dragonite over the sea, then flying with the bag; skipped when motion is reduced or the clip won't play
async function clip(src,ms,cap){const c=$('#cut'),v=$('#cutv');if(RM||!c)return;$('#cutt').textContent=cap||'';v.src=src;v.loop=true;c.classList.remove('hide');
  let ok=true;try{await v.play()}catch(e){ok=false}if(ok)await wait(ms);c.classList.add('out');await wait(350);c.classList.add('hide');c.classList.remove('out');v.pause()}
async function arrive(){show('arrive');if(!RM)sfxSoon('cry',.9);await clip('vid/dn-sea.mp4',2000,T('enRoute'));await clip('vid/dn-fly.mp4',1800,T('enRoute'));dnSheet('img/dn-fly.webp');dnRun();
  const sh=$('#shadow'),dn=$('#dn');
  if(!RM){sh.style.backgroundImage='url(img/dn-fly.webp)';sh.style.backgroundSize=`${DN.cols*DN.fw*Z*2}px ${Math.ceil(DN.n/DN.cols)*DN.fh*Z*2}px`;sh.style.backgroundPosition='0 0';sh.classList.add('go');await wait(1350);dn.classList.add('land');requestAnimationFrame(()=>dn.classList.add('down'));await wait(1500)}
  else{dn.classList.add('down');sfx('cry',.9)}
  $('#ground').classList.add('on');if(!RM)dust();
  await wait(500);dnSheet('img/dn-mail.webp');sfx('tink',.6);
  const b=$('#arrbox');b.innerHTML=`${H('arrived')}<span class="hint">${H('tapEnvelope')}</span>`;b.classList.remove('hide');
  mem.seen=1;save()}
function dust(){const w=$('#dn').parentElement;for(let i=0;i<6;i++){const p=document.createElement('i');p.className='dust';p.style.left=`calc(50% + ${(i-2.5)*Z*9}px)`;p.style.setProperty('--dx',(i-2.5)*Z*4+'px');w.appendChild(p);setTimeout(()=>p.remove(),700)}}
let envOpen=false;
function openEnv(){if(envOpen||$('#arrbox').classList.contains('hide'))return;envOpen=true;sfx('a',.6);$('#env').classList.remove('hide');$('#envbox').innerHTML=`<span class="hint" style="margin:0">${H('tapSeal')}</span>`;sizeEnv()}
$('#dnhit').addEventListener('click',e=>{e.stopPropagation();openEnv()});
$('#arrbox').addEventListener('click',openEnv);

// ---------- 3. the envelope and its seal ----------
const ENV={w:76,h:50,sx:29,sy:19,ss:18};
function sizeEnv(){const ez=Math.max(2,Math.min(5,Math.floor((Math.min(innerWidth,460)-40)/ENV.w)));const im=$('#envimg');im.style.width=ENV.w*ez+'px';im.style.height=ENV.h*ez+'px';const s=$('#seal');Object.assign(s.style,{left:ENV.sx*ez+'px',top:ENV.sy*ez+'px',width:ENV.ss*ez+'px',height:ENV.ss*ez+'px'});}
let sealDone=false;
$('#seal').addEventListener('click',async e=>{e.stopPropagation();if(sealDone)return;sealDone=true;const s=$('#seal');
  if(!RM){s.classList.add('shake');sfx('toss',.5);await wait(1000)}
  sfx('poof',.8);s.style.visibility='hidden';const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
  await wait(250);$('.wrap').classList.add('gone');await wait(RM?0:550);$('#env').classList.add('hide');holo()});

// ---------- 4. Oak's hologram ----------
let LINES=[];let li=0,typing=null,full='';
async function holo(){LINES=TL('oak');show('holo');clearInterval(dnT);mus(true);sfx('tink',.5);await wait(300);$('#beam').classList.add('on');$('#scan').classList.add('on');$('#oak').classList.add('on');await wait(900);say(0)}
function say(i){li=i;full=LINES[i]||'';const t=$('#oaktxt');$('#oaktri').style.visibility='hidden';clearInterval(typing);
  if(RM){t.textContent=full;$('#oaktri').style.visibility='';return}
  let n=0;t.textContent='';typing=setInterval(()=>{n++;t.textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;$('#oaktri').style.visibility=''}},32)}
$('#holo').addEventListener('click',()=>{if(scene!=='holo')return;if(typing){clearInterval(typing);typing=null;$('#oaktxt').textContent=full;$('#oaktri').style.visibility='';return}
  sfx('a',.5);if(li<LINES.length-1)say(li+1);else toLetter(false)});

// ---------- 5. the letter, in pages (like the pockets of the bag) ----------
const DATE=(()=>{const d=Q.get('date')||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return '';try{return new Date(d+'T12:00:00').toLocaleDateString(LANG==='he'?'he-IL':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return d}})();
const DAYS=(()=>{const d=Q.get('date')||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;const t=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)})();
const daysText=()=>DAYS==null||DAYS<0?'':DAYS===0?T('daysToday'):DAYS===1?T('daysTomorrow'):T('daysLeft').replace('{d}',DAYS);
const PLACE=(Q.get('place')||'').trim().slice(0,80), PS=(Q.get('ps')||'').trim().slice(0,500);
const RTL=LANG==='he', AR_NEXT=RTL?'◀':'▶', AR_PREV=RTL?'▶':'◀';
const wa=(text,num)=>{const n=num===undefined?CFG.wa:num;return n||num===''?`https://wa.me/${n?encodeURIComponent(n):''}?text=${encodeURIComponent(text)}`:''};
let page=0,ans='ask',faqI=-1,taps=0;
const pickT=v=>fill(pick(v));
function toLetter(skipped){clearInterval(dnT);clearInterval(typing);$('#env').classList.add('hide');show('letter');skipBtn.classList.add('hide');mus(true);if(!skipped)sfx('page',.6);mem.seen=1;save();
  page=0;renderLetter()}
// the pages, in story order: what this is, the evening's route, what to prepare, the decision;
// after yes also your card, and for the subject the team
function PAGES(){
  if(mem.ans!=='yes')return ROLE==='s'?[['letter',pLetter,()=>{}],['route',pMap,bindMap],['decide',pDex,bindDecide]]:[['letter',pLetter,()=>{}],['decide',pDex,bindDecide]];
  const P=[['hub',pHub,bindHub],['card',pCard,bindCard]];if(hasDates()&&!REMOTE)P.push(['dates',pDates,bindDates]);
  if(ROLE==='s'){P.push(['trainers',pTrainers,bindTrainers]);P.push(['team',pParty,bindParty]);P.push(['route',pMap,bindMap])}P.push(['letter',pLetter,()=>{}]);return P}
const AFTER=()=>mem.ans==='yes';
const pageIdx=k=>PAGES().findIndex(x=>x[0]===k);
function renderLetter(){
  $('#lcol').innerHTML=`<nav class="steps" id="steps"></nav><div id="pg"></div><p class="locknote" id="locknote"></p><div class="pnav" id="pnav"></div><button class="restart" id="restart">${H('restart')}</button>`;
  $('#restart').onclick=()=>{if(!confirm(T('restartAsk')))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
  $('#lcol').addEventListener('click',e=>{if(e.target.id==='notme'&&confirm(T('restartAsk'))){delete mem.me;save();location.reload()}});
  // swipe: in Hebrew the next page comes from the left, in English from the right
  let x0=null,y0=0;const pg=$('#pg');pg.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  pg.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx))return;goPage(page+((dx>0)===RTL?1:-1))},{passive:true});
  goPage(Math.min(page,PAGES().length-1),true)}
// how far you may go: past the route only after every stop, past the prep only after every item (an answered invitation is open)
function reach(){if(mem.ans)return 99;const P=PAGES(),r=P.findIndex(x=>x[0]==='route');if(r>=0&&!mem.routeDone)return r;return 99}
function navBar(){const P=PAGES(),n=P.length,i=page,r=reach();
  if(AFTER()){$('#steps').innerHTML='';$('#locknote').textContent='';$('#pnav').innerHTML=i>0?`<button class="prevbtn" id="prevbtn">${AR_PREV} ${H('backMenu')}</button><span></span>`:'';if($('#prevbtn'))$('#prevbtn').onclick=()=>goPage(0);return}
  const st=$('#steps');st.innerHTML=P.map(([k],j)=>`<button data-p="${j}" class="${j===i?'on':''}${j<i?' done':''}${j>r?' lock':''}" ${j>r?'disabled':''}><b>${j>r?'🔒':j+1}</b>${esc(T('tab_'+k))}</button>`).join('');
  st.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>goPage(+b.dataset.p));
  const lockMsg=i>=r&&i<n-1?(P[i][0]==='route'?'routeLocked':''):'';
  $('#pnav').innerHTML=(i>0?`<button class="prevbtn" id="prevbtn">${AR_PREV} ${H('prev')}</button>`:'<span></span>')+(i<n-1?`<button class="nextbtn${lockMsg?' locked':''}" id="nextbtn" ${lockMsg?'disabled':''}>${esc(T('nextTo').replace('{x}',T('tab_'+P[i+1][0])))} ${lockMsg?'🔒':AR_NEXT}</button>`:'');
  $('#locknote').textContent=lockMsg?T(lockMsg):'';
  if($('#prevbtn'))$('#prevbtn').onclick=()=>goPage(page-1);if($('#nextbtn')&&!lockMsg)$('#nextbtn').onclick=()=>goPage(page+1)}
function goPage(i,first){const P=PAGES(),n=P.length;if(i<0||i>=n||i>reach())return;const dir=i>page?1:-1;page=i;if(!first)sfx('a',.4);stopPlay();
  navBar();const st=$('#steps');
  const on=st&&st.querySelector('.on');if(on)st.scrollLeft+=on.getBoundingClientRect().left-st.getBoundingClientRect().left-(st.clientWidth-on.clientWidth)/2;
  const pg=$('#pg');pg.innerHTML=P[i][1]();pg.className=first?'':(dir>0?'in-next':'in-prev');
  $('#letter').scrollTo(0,0);P[i][2]()}
const ptitle=k=>`<h1 class="ptitle">${H(k)}</h1>`;

// ---- 1. the letter ----
function pLetter(){return `<article class="paper">
    <img class="stamp px" src="img/seal.png" alt="">
    <p class="kick">${H('letterKicker')}</p>
    <h1>${H('letterTitle')}</h1>
    <p class="to">${H('letterTo')}</p>
    ${TL('letter').map(p=>`<p>${esc(p)}</p>`).join('')}
    ${!REMOTE&&placeNow()?`<p class="whn"><b>${H('where')}:</b> ${esc(placeNow())}</p>`:''}
    <p class="sign">${H('letterSign')}</p>

function fakeFriends(){const have=new Set(party().map(f=>f.n)),add=FAKE[LANG==='en'?'en':'he'].filter(([n])=>!have.has(n));
  add.forEach(([n,g],i)=>{const f={n,g,k:rid(8),...(i===4?{r:1}:{})};party().push(f);dbRoster(f,'inv')});save();toast(T('fakeAdded'));
  add.forEach(([n],i)=>setTimeout(()=>fakeAnswer(n,i),4000+i*7000+Math.random()*4000))}
async function fakeAnswer(n,i){const f=party().find(x=>x.n===n);if(!f)return;const db=await dbReady;if(!db||!mem.iid)return;const D=(FILE&&FILE.dates)||[],no=i===5;
  try{await db.doc('invites/'+mem.iid).set({team:{[f.k]:{n:f.n,g:f.g,ans:no?'no':'yes',r:f.r?1:0,av:no?null:(fakeBase+i*11)%MINI_N,d:f.r||no?[]:D.filter(()=>Math.random()<.7),at:now()}}},{merge:true})}catch(e){}}
document.addEventListener('click',e=>{if(!TEST())return;const a=e.target.closest('a[href*="wa.me"],#sshare');if(!a)return;e.preventDefault();e.stopPropagation();
  if(a.id==='swa'||a.id==='sshare'){mem.sentAll=1;save()}toast(T('testNoSend'))},true);
function testBar(){document.body.classList.toggle('testm',TEST());if(TEST()&&!$('#testbar')){const d=document.createElement('div');d.id='testbar';d.textContent=T('testBar');document.body.appendChild(d)}}

// ---------- the evening itself: the same link leads into it, and afterwards shows the filled Pokédex entry ----------
let EVE=null,eveUn=null;
function watchEve(){if(eveUn||!FILE||!FILE.room)return;eveUn=1;dbReady.then(db=>{if(!db)return;eveUn=db.doc('state/'+FILE.room).onSnapshot(d=>{EVE=d.exists?d.data():null;const cur=PAGES()[page];if(scene==='letter'&&cur&&cur[0]==='hub'&&!$('.locp')){$('#pg').innerHTML=pHub();bindHub()}},()=>{})})}
function eveBlock(){if(!FILE||!FILE.room||(EVE&&EVE.revealed))return '';const base=location.pathname.replace(/invite\/.*$/,''),nm=encodeURIComponent(ROLE==='s'?NAME:NAME);
  if(REMOTE)return `<section class="blk eveb"><h2>${H('eveRemoteT')}</h2><p>${H('eveRemote')}</p><a class="nextbtn wbtn glow" href="${base}?n=${nm}#remote=${esc(FILE.room)}">${H('eveRemoteBtn')}</a></section>`;
  const s=evDate();if(s&&cdText()!==T('cdToday')&&s>new Date())return '';
  return `<section class="blk eveb"><h2>${H('eveT')}</h2><a class="nextbtn wbtn glow" href="${base}?n=${nm}#r=${esc(FILE.room)}">${H('eveBtn')}</a></section>`}
function dexDone(){const r=EVE&&EVE.revealed&&EVE.result;if(!r)return '';const sd=r.spriteData||'',src=sd?(/^(data:|https?:)/.test(sd)?sd:'../'+sd):'',ty=Array.isArray(r.types)?r.types.join(' / '):String(r.types||'');
  return `<section class="dex done"><div class="dexscr"><div class="dexsil">${src?`<img src="${src}" alt="">`:'★'}</div><div class="dexinfo"><b class="dno">PSP</b><b class="dnm">${esc(r.finalName||'')}</b>${ty?`<span>${H('dexType')}: ${esc(ty)}</span>`:''}<span>${esc(ROLE==='s'?NAME:BY)}</span></div></div><p class="dexdesc">${H('dexDoneT')}</p></section>`}

function hubTiles(){const P=party(),T0=TEAM||{},yes=P.filter(f=>T0[f.k]&&T0[f.k].ans==='yes'),tr=mem.trainers||[],tiles=[];
  const tile=(k,ic,sub,done)=>tiles.push(`<button class="hubt${done?' done':''}" data-go="${k}"><span class="hi">${ic}</span><b>${H('tab_'+k)}</b><small>${esc(sub)}</small></button>`);
  tile('card',`<span class="hav">${cardFig()}</span>`,mem.av!=null?'✓':T('hubPick'),mem.av!=null);
  if(hasDates()&&!REMOTE)tile('dates','📅',FILE.date?fmtD(FILE.date):myDates().length?T('hubMarked').replace('{n}',myDates().length):T('hubPick'),!!FILE.date);
  if(ROLE==='s'){tile('trainers','🎒',`${tr.filter(x=>x&&x.t&&x.t.trim()).length}/4`,tr.filter(x=>x&&x.t&&x.t.trim()&&x.n&&x.n.trim()).length>=4);
    tile('team',`<span class="ball" style="--s:30px;display:block"></span>`,P.length?`${yes.length}/${P.length} ✓`:T('hubPick'),P.length>=4&&yes.length===P.length)}
  return tiles.join('')}
function pHub(){const link=ROLE==='f'?wa(T('waYes'),''):wa(T('waYes'));
  const pickFirst=ROLE==='s'&&FILE&&!FILE.loc;
  return `<p class="savedtag">${H('saved')}</p>${ptitle(ROLE==='s'?'ckTitle':'f_hubTitle')}${eveBlock()}${dexDone()}
  ${pickFirst?wwBlock():''}<div class="hubg">${hubTiles()}</div>
  ${pickFirst?'':wwBlock()}${ROLE==='f'?crewRow():''}
  ${ROLE==='s'?`<section class="blk">${checklistHTML()}</section>`:`<section class="blk"><ol class="todo">${(TXR('todo')||[]).filter(x=>!x.go).map((x,i)=>`<li><b>${esc(pickT(x.t))}</b><span>${esc(pickT(x.d))}</span>${i===0&&link?`<a class="wa" href="${link}" target="_blank" rel="noopener">${H('waYesBtn')}</a>`:''}</li>`).join('')}</ol></section>`}
  <div class="hubl">${ROLE==='s'?`<button class="ghostbtn" data-go="route">🗺 ${H('routeTitle')}</button>`:''}<button class="ghostbtn" data-go="letter">✉ ${H('hubLetter')}</button></div>
  <button class="linkbtn" id="chg">${H('changeAnswer')}</button>`}
function bindHub(){bindWW();document.querySelectorAll('#pg [data-go]').forEach(b=>b.onclick=()=>goPage(pageIdx(b.dataset.go)));
  document.querySelector('#pg .tellbtn')?.addEventListener('click',()=>{mem.told=1;save();setTimeout(()=>{if(PAGES()[page][0]==='hub'){$('#pg').innerHTML=pHub();bindHub()}},800)});
  $('#chg').onclick=()=>{delete mem.ans;mem.declined=1;save();dbSync({ans:'no'});ans='ask';page=PAGES().length-1;renderLetter()}}

// ---------- 7. saving: "What? Your invitation is evolving!" ----------
function evolve(done){const o=$('#evo'),box=$('#evotxt'),stage=$('#evostage');o.classList.remove('hide');
  const fsrc=typeof mem.av==='number'?`../img/mini/${mem.av}.png`:(G==='f'?'../img/ow-girl.png':'../img/ow-boy.png');
  stage.innerHTML=`<img class="px evoa" src="img/envelope.png" alt=""><img class="px evoc" src="${fsrc}" alt=""><div class="evob tcard mini"><div class="tchead"><span>${esc(T('cardHead'))}</span></div><div class="tcbody"><b class="nm">${esc(NAME)}</b>${cardFig()}</div></div>`;
  const ea=stage.querySelector('.evoa'),eb=stage.querySelector('.evob'),ec=stage.querySelector('.evoc');eb.style.display='none';ec.style.display='none';
  let ev=null;const say=t=>{box.textContent=t};
  say(T('evoSaving')+'\n'+T('evoDont'));sfx('page',.6);
  const go=async()=>{await wait(1600);say(T('evoWhat'));
    if(soundOn){try{ev=new Audio('../mus-evolution.mp3');ev.volume=.5;ev.play().catch(()=>{})}catch(e){}}
    if(!RM){ea.classList.add('sil');ec.classList.add('sil');let gap=420,show=false;const t0=performance.now();
      while(performance.now()-t0<3600){show=!show;ea.style.display=show?'none':'';ec.style.display=show?'':'none';await wait(gap);gap=Math.max(70,gap*.82)}}
    ea.style.display='none';ec.style.display='';ec.classList.remove('sil');const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
    sfx('caught',.8);say(T('evoDone'));await wait(1300);ec.style.display='none';eb.style.display='';await wait(1500);say(T('evoFly'));
    if(!RM){stage.innerHTML='<video class="evov" src="vid/dn-fly.mp4" muted playsinline autoplay loop></video>';const ev2=stage.querySelector('video');try{await ev2.play()}catch(e){}}
    await wait(2600);if(ev){const v0=ev.volume;for(let k=10;k>=0;k--){ev.volume=v0*k/10;await wait(60)}ev.pause()}
    o.classList.add('hide');done();mus(true)};
  go()}
// returning visitors who already answered still start at PRESS START (the sound needs a tap), and can skip
})();
